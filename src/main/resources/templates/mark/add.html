<!DOCTYPE html>
<html lang="es"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments/head">
  <title>Añadir Nota</title>
</head>

<body>
<nav th:replace="fragments/nav"></nav>

<div class="container">
  <h2>Agregar nota</h2>

  <form class="form-horizontal"
        th:action="@{/mark/add}"
        method="post"
        th:object="${mark}">

    <div class="form-group">
      <label class="control-label col-sm-2">Alumno:</label>
      <div class="col-sm-10">
        <select class="form-control" th:field="*{user.id}">
          <option value="" disabled selected>Seleccione un alumno</option>
          <option th:each="user : ${usersList}"
                  th:value="${user.id}"
                  th:text="${user.dni} + ' - ' + ${user.name} + ' ' + ${user.lastName}">
          </option>
        </select>
        <span class="text-danger"
              th:if="${#fields.hasErrors('user')}"
              th:errors="*{user}">
                </span>
      </div>
    </div>

    <div class="form-group">
      <label class="control-label col-sm-2">Puntuación:</label>
      <div class="col-sm-10">
        <input type="number"
               step="any"
               class="form-control"
               th:field="*{score}"
               placeholder="Entre 0 y 10"/>

        <span class="text-danger"
              th:if="${#fields.hasErrors('score')}"
              th:errors="*{score}">
                </span>
      </div>
    </div>

    <div class="form-group">
      <label class="control-label col-sm-2">Descripción:</label>
      <div class="col-sm-10">
        <input type="text"
               class="form-control"
               th:field="*{description}"
               placeholder="Mínimo 20 caracteres"/>

        <span class="text-danger"
              th:if="${#fields.hasErrors('description')}"
              th:errors="*{description}">
                </span>
      </div>
    </div>

    <div class="form-group">
      <div class="col-sm-offset-2 col-sm-10">
        <button type="submit" class="btn btn-primary">
          Enviar
        </button>
      </div>
    </div>

  </form>
</div>

<footer th:replace="fragments/footer"></footer>
</body>
</html>
