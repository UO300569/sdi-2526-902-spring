<!DOCTYPE html>
<html lang="en">
<head th:replace="/department/fragments/departmentHead"><title>Gestionar departamentos</title></head>
<body>
<nav th:replace="/department/fragments/departmentNav"></nav>

<div class="container" id="main-container">
    <h2>Editar departamento</h2>
    <form class="form-horizontal" method="post" th:action="${'/department/edit/'+ department.id}">
        <div class="form-group">
            <label class="control-label col-sm-2" for="code">Código:</label>
            <div class="col-sm-10">
                <input th:value="${department.code}" id="code" type="text" class="form-control" name="code"
                       placeholder="Ejemplo Ejercicio 1" required/>
            </div>
        </div>
        <div class="form-group">
            <label class="control-label col-sm-2" for="name">Nombre:</label>
            <div class="col-sm-10">
                <input th:value="${department.name}" id="name" type="text" class="form-control" name="name"
                       placeholder="Ejemplo Ejercicio 1" required/>
            </div>
        </div>
        <div class="form-group">
            <label class="control-label col-sm-2" for="faculty">Faculty:</label>
            <div class="col-sm-10">
                <input th:value="${department.faculty}" id="faculty" type="text" class="form-control" name="faculty"
                       placeholder="Ejemplo Ejercicio 1" required/>
            </div>
        </div>
        <div class="form-group">
            <label class="control-label col-sm-2" for="telephone">Teléfono:</label>
            <div class="col-sm-10">
                <input th:value="${department.telephone}" id="telephone" type="text" class="form-control" name="telephone"
                       placeholder="Ejemplo Ejercicio 1" required/>
            </div>
        </div>
        <div class="form-group">
            <label class="control-label col-sm-2" for="professors">Número de profesores:</label>
            <div class="col-sm-10">
                <input th:value="${department.professors}" id="professors" type="number" class="form-control" name="professors"
                       placeholder="Ejemplo Ejercicio 1" required/>
            </div>
        </div>
        <div class="form-group">
            <div class="col-sm-offset-2 col-sm-10">
                <button type="submit" class="btn btn-primary">Modificar</button>
            </div>
        </div>
    </form>
</div>
<footer th:replace="department/fragments/departmentFooter"></footer>
</body>
</html>
