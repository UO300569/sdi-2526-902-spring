<!DOCTYPE html>
<html lang="en">
<head th:replace="/department/fragments/departmentHead"><title>Gestionar departamentos</title></head>
<body>
<nav th:replace="/fragments/nav"></nav>

<div class="container" id="main-container">
    <h2>Departamentos</h2>
    <p>Los departamentos que actualmente figuran en el sistema son las siguientes:</p>
    <div class="table-responsive">
        <table class="table table-hover">
            <thead>
            <tr>
                <th scope="col">id</th>
                <th scope="col">Código</th>
                <th scope="col">Nombre</th>
                <th scope="col"></th>
                <th scope="col"></th>
                <th scope="col"></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="department : ${departmentList}">
                <td scope="row" th:text="${department.id}"> 1</td>
                <td th:text="${department.code}"></td>
                <td th:text="${department.name}"></td>
                <td><a th:href="${'/department/details/' + department.id}">detalles</a></td>
                <td><a th:href="${'/department/edit/' + department.id}">modificar</a></td>
                <td><a th:href="${'/department/remove/' + department.id}">eliminar</a></td>
            </tr>
            </tbody>
        </table>
    </div>
    <div th:if="${#lists.isEmpty(departmentList)}"> No departments </div>
    <footer th:replace="fragments/pagination"></footer>
</div>

<footer th:replace="department/fragments/departmentFooter"></footer>
</body>
</html>
