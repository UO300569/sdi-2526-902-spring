<!DOCTYPE html>
<html lang="en">
<head th:replace="/department/fragments/departmentHead"><title>Gestionar departamentos</title></head>
<body>
<nav th:replace="/department/fragments/departmentNav"></nav>

<div class="container" id="main-container">
    <h2>Agregar nota</h2>
    <form class="form-horizontal" method="post" action="/department/add">
        <div class="form-group">
            <label class="control-label col-sm-2" for="code">Código:</label>
            <div class="col-sm-10">
                <input type="text" class="form-control" id="code" name="code" placeholder="INF-01" required="true" />
            </div>
        </div>
        <div class="form-group">
            <label class="control-label col-sm-2" for="name">Nombre:</label>
            <div class="col-sm-10">
                <input type="text" class="form-control" id="name" name="name" placeholder="Departamento de Informática" required="true" />
            </div>
        </div>
        <div class="form-group">
            <label class="control-label col-sm-2" for="faculty">Facultad:</label>
            <div class="col-sm-10">
                <input type="text" class="form-control" id="faculty" name="faculty" placeholder="EII" required="true" />
            </div>
        </div>
        <div class="form-group">
            <label class="control-label col-sm-2" for="telephone">Teléfono:</label>
            <div class="col-sm-10">
                <input type="text" class="form-control" id="telephone" name="telephone" placeholder="xxxxxxxxx" required="true" />
            </div>
            <div class="form-group">
                <label class="control-label col-sm-2" for="professors">Número de profesores:</label>
                <div class="col-sm-10">
                    <input type="number" class="form-control" id="professors" name="professors" placeholder="120" required="true" />
                </div>
            </div>
        </div>
        <div class="form-group">
            <div class="col-sm-offset-2 col-sm-10">
                <button type="submit" class="btn btn-primary">Enviar</button>
            </div>
        </div>
    </form>
</div>

<footer th:replace="department/fragments/departmentFooter"></footer>
</body>
</html>
