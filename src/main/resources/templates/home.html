<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="fragments/head"></head>
<body>
<nav th:replace="fragments/nav"></nav>
<div class="container" style="text-align: center"><h2 th:text="#{welcome.message}"></h2>
    <h3>Esta es una zona privada la web</h3>
    <p> Usuario Autenticado como: <span th:text="${#authentication.name}"></span></p>
    <div class="table-responsive">
        <table class="table table-hover" th:fragment="marksTable" id="marksTable">
            <thead>
            <tr>
                <th scope="col">id</th>
                <th scope="col">Descripción</th>
                <th scope="col">Puntuación</th>
                <th scope="col"></th>
                <th scope="col" sec:authorize="hasRole('ROLE_PROFESSOR')"></th>
                <th scope="col" sec:authorize="hasRole('ROLE_PROFESSOR')"></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="mark : ${marksList}">
                <td th:text="${mark.id}"> 1</td>
                <td th:text="${mark.description}"> Ejercicio 1</td>
                <td th:text="${mark.score}">10</td>
                <td><a th:href="${'/mark/details/' + mark.id}">detalles</a></td>
                <td sec:authorize="hasRole('ROLE_PROFESSOR')">
                    <a th:href="${'/mark/edit/' + mark.id}">modificar</a></td>
                <td sec:authorize="hasRole('ROLE_PROFESSOR')">
                    <a th:href="${'/mark/delete/' + mark.id}">eliminar</a></td>
            </tr>
        </table>
    </div>
</div>
</tbody>
</table>
</div>
<footer th:replace="fragments/footer"></footer>
</body>
</html>
